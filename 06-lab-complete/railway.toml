# Railway: build bằng Dockerfile, CMD trong Dockerfile lắng nghe $PORT do Railway cấp.
# Secret (AGENT_API_KEY) và REDIS_URL đặt bằng `railway variables`, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
